<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA: tells Chrome this is an installable app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DK Budget">
  <meta name="application-name" content="DK Budget">
  <meta name="theme-color" content="#1A1A2E">

  <!-- PWA manifest link -->
  <link rel="manifest" href="manifest.json">

  <!-- App icon (uses the emoji as favicon fallback) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231A1A2E'/><text y='.9em' font-size='80' x='10'>💰</text></svg>">

  <title>DK Budget</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #1A1A2E;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, sans-serif;
    }
    .logo {
      font-size: 48px;
      font-weight: 900;
      color: #E8B84B;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }
    .logo span { color: rgba(255,255,255,0.3); }
    .sub {
      font-size: 13px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="logo">DK<span> Budget</span></div>
  <div class="sub">Loading…</div>

  <script>
    // Replace this URL with your actual Apps Script deployment URL
    var APP_URL = "https://script.google.com/macros/s/AKfycbxgtuADtt8l_iTylzkxW-oKPeZRYIJK-RBKZ8q73CaxGtUGTwK5pR7cZcbmUIB6baAq/exec";

    // Small delay so the splash shows, then redirect
    setTimeout(function() {
      window.location.replace(APP_URL);
    }, 800);
  </script>
</body>
</html>
